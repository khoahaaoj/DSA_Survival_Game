name: Build & Release Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "DSA_Survival_Game" `
            --add-data "assets;assets" `
            --add-data "settings.py;." `
            --hidden-import pygame `
            --collect-all pygame `
            main.py

      - name: Compress Build to ZIP
        run: |
          Compress-Archive -Path dist/DSA_Survival_Game -DestinationPath dist/DSA-Survival-Game-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSA-Survival-Game-Windows
          path: dist/DSA-Survival-Game-Windows.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DSA-Survival-Game-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
